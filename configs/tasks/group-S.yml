# Permutation composition (word problem) on the symmetric group S_n, as used in the
# paper (Section "Experiments on state-tracking permutation tasks"). `vocab_size` is
# the degree n (S3: 6 elements, S4: 24, S5: 120); the model vocabulary is the group
# order, which train.py derives automatically. Sequence length 16 for train and test.
baseline:
  seq_len: 16
  num_test_examples: 1280
  multi_query: True
  k_motif_size: 1
  v_motif_size: 1
  frac_noise: 0.0
  noise_vocab_size: 0
  num_tokens_to_copy: 16   # unused here; kept so dataset paths match (ntc-16)

# Explicit list (not baseline + single changes): the five data configurations of the paper.
configs:
  - {vocab_size: 3, num_train_examples: 10000}
  - {vocab_size: 3, num_train_examples: 250}
  - {vocab_size: 4, num_train_examples: 50000}
  - {vocab_size: 4, num_train_examples: 3000}
  - {vocab_size: 5, num_train_examples: 100000}
