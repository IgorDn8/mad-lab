# Fuzzy in-context recall (keys and values are motifs of 3 adjacent tokens);
# reported in the paper's extended tables. Same four-dataset scheme as the main tasks.
baseline:
  vocab_size: 16
  seq_len: 64
  num_train_examples: 20000
  num_test_examples: 1280
  multi_query: True
  k_motif_size: 3
  v_motif_size: 3
  frac_noise: 0.0
  noise_vocab_size: 0
  num_tokens_to_copy: 16   # unused here; kept so dataset paths match (ntc-16)

# Each entry of `changes` is applied on its own to the baseline (MAD protocol), giving
# four datasets: baseline, larger vocabulary, longer sequences, fewer training examples.
changes:
  vocab_size: [32]
  seq_len: [128]
  num_train_examples: [10000]
